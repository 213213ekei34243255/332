<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#04050a">
  <title>Christ Junior College · Staff appointments</title>
  <link rel="icon" href="/staff-static/img/favicon.png">
  <link rel="stylesheet" href="/staff-static/base.css">
  <link rel="stylesheet" href="/staff-static/admin.css">
</head>
<body>
  <div id="login" class="login-wrap" hidden>
    <div class="brandbar big">
      <img class="logo-cjc" src="/staff-static/img/cjc-logo.png" alt="Christ Junior College, Bengaluru-29" width="198" height="66">
      <span class="sep" aria-hidden="true"></span>
      <img class="logo-cogni" src="/staff-static/img/cogniai-logo.png" alt="CogniAI Studios" width="139" height="60">
    </div>
    <form id="login-form" class="card login-card stack">
      <div class="eyebrow" id="login-org">Christ Junior College</div>
      <h1>Sign in</h1>
      <p class="muted small">Teaching and staff appointments &mdash; administration. Authorised staff only.</p>
      <div class="notice danger" id="login-error" role="alert" hidden></div>
      <div><label class="field" for="password">Admin password</label><input type="password" id="password" autocomplete="current-password" required></div>
      <button class="btn block" type="submit" id="login-btn">Sign in</button>
    </form>
  </div>

  <div id="app" class="shell" hidden>
    <header class="topbar">
      <div class="bar-inner">
        <div class="top-left">
          <button class="btn secondary small menu-btn" id="menu-btn" aria-label="Menu">&#9776;</button>
          <div class="brandbar">
            <img class="logo-cjc" src="/staff-static/img/cjc-logo.png" alt="Christ Junior College, Bengaluru-29" width="130" height="43">
            <span class="sep" aria-hidden="true"></span>
            <img class="logo-cogni" src="/staff-static/img/cogniai-logo.png" alt="CogniAI Studios" width="88" height="38">
          </div>
        </div>
        <div class="top-right"><span class="badge info hide-sm">Staff appointments</span><span class="tiny muted mobile-only" id="mobile-title"></span></div>
      </div>
    </header>
    <aside class="side" id="side">
      <div class="side-org"><span class="live-dot" aria-hidden="true"></span><span id="org">Christ Junior College</span></div>
      <nav class="nav" id="nav">
        <a href="#/overview" data-route="overview">Overview</a>
        <a href="#/positions" data-route="positions">Positions</a>
        <a href="#/applications" data-route="applications">Applications</a>
        <a href="#/interviews" data-route="interviews">Interviews &amp; videos</a>
        <a href="#/emails" data-route="emails">Email log</a>
        <a href="#/system" data-route="system">System</a>
      </nav>
      <div class="side-foot">
        <a class="small" href="/apply" target="_blank" rel="noopener">Public application page &#8599;</a>
        <button class="btn secondary small block" id="logout-btn">Sign out</button>
      </div>
    </aside>
    <div class="main">
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <script type="module" src="/staff-static/admin.js"></script>
</body>
</html>
